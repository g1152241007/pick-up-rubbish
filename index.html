<!DOCTYPE html>

    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* 浪花動畫 */
        @keyframes waveMove {
            0% { transform: translateX(0) scaleY(1); }
            50% { transform: translateX(-2%) scaleY(1.05); }
            100% { transform: translateX(0) scaleY(1); }
        }

        .wave-animation {
            animation: waveMove 4s ease-in-out infinite;
        }

        /* 雲朵從左向右飄移動畫 (支援流暢無縫循環) */
        @keyframes cloudFloatLeftToRight {
            0% {
                transform: translateX(-150%);
            }
            100% {
                transform: translateX(100vw);
            }
        }

        .animate-cloud-1 {
            animation: cloudFloatLeftToRight 38s linear infinite;
            animation-delay: -5s;
        }

        .animate-cloud-2 {
            animation: cloudFloatLeftToRight 50s linear infinite;
            animation-delay: -22s;
        }

        .animate-cloud-3 {
            animation: cloudFloatLeftToRight 32s linear infinite;
            animation-delay: -12s;
        }

        .animate-cloud-4 {
            animation: cloudFloatLeftToRight 45s linear infinite;
            animation-delay: -35s;
        }

        /* 垃圾被點擊消失動畫 */
        @keyframes collectPop {
            0% { transform: scale(1) rotate(var(--rot)); opacity: 1; }
            50% { transform: scale(1.4) rotate(calc(var(--rot) + 20deg)); opacity: 0.8; }
            100% { transform: scale(0) rotate(calc(var(--rot) - 40deg)); opacity: 0; }
        }

        .trash-collecting {
            animation: collectPop 0.35s ease-out forwards;
            pointer-events: none;
        }

        /* 分數浮動特效 */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }

        .score-popup {
            position: absolute;
            font-weight: 900;
            color: #10B981;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.3), 0 0 10px rgba(255,255,255,0.8);
            pointer-events: none;
            animation: floatUp 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            z-index: 50;
        }

        /* 浮動小海龜動畫 */
        @keyframes floatTurtle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        .turtle-float {
            animation: floatTurtle 3s ease-in-out infinite;
        }
    </style>
</head>

        // SDGs 環保知識庫
        const SDGs_FACTS = [
            "每年有超過 800 萬噸塑膠垃圾流入海洋，相當於每分鐘有一整輛垃圾車把塑膠倒進海裡。",

            "海龜常常把飄浮的塑膠袋誤認為是美味的水母而吞下，導致腸道阻塞與死亡。",
            "廢棄漁網（幽靈漁網）在海洋中會持續纏繞魚類、珊瑚與海洋保育動物，造成長期傷害。",
            "淨灘不僅是清除垃圾，更重要的是從源頭「減塑」與「不塑」，攜帶環保杯與購物袋！",
            "SDG 14「保育海洋生態」旨在永續利用海洋資源，預防與減少各類海洋污染。"
        ];

        /* ==================== 遊戲狀態變數 ==================== */
        let score = 0;
        let collectedCount = 0;
        let level = 1;
        const TOTAL_TRASH = 50;

        // DOM 元素
        const gameArea = document.getElementById('game-area');
        const scoreDisplay = document.getElementById('score-display');
        const countDisplay = document.getElementById('count-display');
        const levelDisplay = document.getElementById('level-display');
        const victoryModal = document.getElementById('victory-modal');
        const modalScore = document.getElementById('modal-score');
        const sdgsModal = document.getElementById('sdgs-modal');

        // 音效系統
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playPickupSound(category) {
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let baseFreq = 400;
                if (category === 'large') baseFreq = 260;
                if (category === 'small') baseFreq = 580;

                const now = audioCtx.currentTime;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.12);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.start(now);
                osc.stop(now + 0.15);
            } catch (e) {
                // 靜音備用
            }
        }

        // 生成 50 個隨機散佈於海灘區域（下半部）的垃圾
        function generateTrash() {
            gameArea.innerHTML = '';
            collectedCount = 0;
            updateUI();

            const areaWidth = gameArea.clientWidth;
            const areaHeight = gameArea.clientHeight;

            // 限制垃圾分佈於下半部 (海灘區: y 從 45% 到 85%)
            const minY = areaHeight * 0.45;
            const maxY = areaHeight * 0.85;

            for (let i = 0; i < TOTAL_TRASH; i++) {
                const type = TRASH_TYPES[Math.floor(Math.random() * TRASH_TYPES.length)];
                const rotation = Math.floor(Math.random() * 360);

                const padding = 40;
                const posX = padding + Math.random() * (areaWidth - padding * 2 - type.width);
                const posY = minY + Math.random() * (maxY - minY - type.height);

                const trashEl = document.createElement('div');
                trashEl.className = 'absolute cursor-pointer transform hover:scale-115 transition-transform duration-150 active:scale-95';
                trashEl.style.left = `${posX}px`;
                trashEl.style.top = `${posY}px`;
                trashEl.style.width = `${type.width}px`;
                trashEl.style.height = `${type.height}px`;
                trashEl.style.transform = `rotate(${rotation}deg)`;
                trashEl.style.setProperty('--rot', `${rotation}deg`);
                trashEl.innerHTML = type.svg;
                trashEl.title = `${type.name} (+${type.score}分)`;

                trashEl.addEventListener('click', (e) => collectTrash(e, trashEl, type, posX, posY));
                trashEl.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    collectTrash(e, trashEl, type, posX, posY);
                }, { passive: false });

                gameArea.appendChild(trashEl);
            }
        }

        // 點擊垃圾處理
        function collectTrash(event, element, type, x, y) {
            if (element.classList.contains('trash-collecting')) return;

            element.classList.add('trash-collecting');

            playPickupSound(type.category);
            if (navigator.vibrate) navigator.vibrate(25);

            score += type.score;
            collectedCount++;
            updateUI();

            showScorePopup(x, y, type.score);

            setTimeout(() => {
                if (element.parentNode) {
                    element.parentNode.removeChild(element);
                }
            }, 350);

            if (collectedCount >= TOTAL_TRASH) {
                setTimeout(triggerVictory, 600);
            }
        }

        // 顯示浮動加分文字
        function showScorePopup(x, y, points) {
            const popup = document.createElement('div');
            popup.className = 'score-popup text-lg md:text-xl';
            popup.innerText = `+${points}`;
            popup.style.left = `${x + 10}px`;
            popup.style.top = `${y - 15}px`;

            gameArea.appendChild(popup);

            setTimeout(() => {
                if (popup.parentNode) popup.parentNode.removeChild(popup);
            }, 800);
        }

        // 更新頂部 UI 資訊
        function updateUI() {
            scoreDisplay.innerText = score;
            countDisplay.innerText = collectedCount;
            levelDisplay.innerText = level;
        }

        // 觸發全數撿完任務成功
        function triggerVictory() {
            modalScore.innerText = score;
            
            const randomFact = SDGs_FACTS[Math.floor(Math.random() * SDGs_FACTS.length)];
            document.getElementById('sdg-fact-text').innerText = randomFact;

            victoryModal.classList.remove('hidden');
            setTimeout(() => {
                victoryModal.classList.add('opacity-100');
                victoryModal.querySelector('div').classList.remove('scale-90');
                victoryModal.querySelector('div').classList.add('scale-100');
            }, 20);
        }

        // 下一關
        function nextLevel() {
            level++;
            closeVictoryModal();
            generateTrash();
        }

        // 重新開始遊戲
        function restartGame() {
            score = 0;
            level = 1;
            closeVictoryModal();
            generateTrash();
        }

        function closeVictoryModal() {
            victoryModal.classList.remove('opacity-100');
            victoryModal.querySelector('div').classList.remove('scale-100');
            victoryModal.querySelector('div').classList.add('scale-90');
            setTimeout(() => {
                victoryModal.classList.add('hidden');
            }, 300);
        }

        // SDGs 知識彈窗控制
        function showSdgsTip() {
            const randomFact = SDGs_FACTS[Math.floor(Math.random() * SDGs_FACTS.length)];
            document.getElementById('sdgs-tip-content').innerText = randomFact;
            sdgsModal.classList.remove('hidden');
        }

        function closeSdgsTip() {
            sdgsModal.classList.add('hidden');
        }

        // 初始化遊戲
        window.addEventListener('load', () => {
            generateTrash();
        });

        // 視窗尺寸改變時重新排列未撿拾垃圾，避免垃圾飄出邊界
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (collectedCount < TOTAL_TRASH) {
                    generateTrash();
                }
            }, 300);
        });
    </script>
</body>
</html>
